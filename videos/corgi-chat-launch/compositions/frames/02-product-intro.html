  <script>
    (() => {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const addressEl = document.querySelector("#hf-02-product-intro-address");
      const cursorEl = document.querySelector("#hf-02-product-intro-cursor");
      const sequence = [
        { t: 0.0, text: "", color: "#241A12" },
        { t: 0.12, text: "live", color: "#241A12" },
        { t: 0.28, text: "live from", color: "#241A12" },
        { t: 0.48, text: "live from 9", color: "#FF5C00" },
        { t: 0.7, text: "live from 9 Claude", color: "#FF5C00" },
        { t: 0.96, text: "live from 9 Claude Lane,", color: "#FF5C00" },
        { t: 1.24, text: "live from 9 Claude Lane, San", color: "#241A12" },
        { t: 1.5, text: "live from 9 Claude Lane, San Francisco", color: "#241A12" },
      ];

      const entryAt = (time) => {
        for (let i = sequence.length - 1; i >= 0; i -= 1) {
          if (time >= sequence[i].t) return sequence[i];
        }
        return sequence[0];
      };

      tl.fromTo(
        "#hf-02-product-intro-art",
        { y: 86, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.2, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        ["#hf-02-product-intro-title-corgi", "#hf-02-product-intro-title-chat"],
        { y: 74, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.74, stagger: 0.16, ease: "power3.out" },
        1.3,
      );

      tl.fromTo(
        "#hf-02-product-intro-paw-chip",
        { opacity: 0 },
        { opacity: 1, duration: 0.34, ease: "power2.out" },
        2.8,
      );

      const typeDriver = { t: 0 };
      tl.to(
        typeDriver,
        {
          t: 2.2,
          duration: 2.2,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(typeDriver.t);
            addressEl.textContent = entry.text;
            cursorEl.style.background = entry.color;
          },
        },
        2.8,
      );

      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 3,
          duration: 2.2,
          ease: "none",
          onUpdate: () => {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        2.8,
      );

      window.__timelines["02-product-intro"] = tl;
    })();
  </script>
