<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f6f6f6; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .screen {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.9" data-width="1920" data-height="1080">
      <div id="demo-background" class="clip" style="position:absolute;inset:0;background:#f6f6f6" data-start="0" data-duration="15.9" data-track-index="0"></div>

      <video id="landing-demo" class="clip screen" src="assets/clip-landing.mp4" muted playsinline
        data-start="0" data-duration="6.4" data-track-index="1"></video>

      <video id="guestbook-demo" class="clip screen" src="assets/clip-guestbook.mp4" muted playsinline
        data-trim-start="4.8" data-start="6.15" data-duration="9.75" data-track-index="2"></video>

      <audio id="demo-click" src="assets/sfx/click.mp3" data-start="5.45" data-duration="0.37" data-track-index="10" data-volume="0.5"></audio>
      <audio id="demo-whoosh" src="assets/sfx/whoosh-short.mp3" data-start="6.15" data-duration="0.57" data-track-index="11" data-volume="0.22"></audio>
      <audio id="demo-typing" src="assets/sfx/typing.mp3" data-start="8.65" data-duration="1.5" data-track-index="12" data-volume="0.28"></audio>
      <audio id="demo-send" src="assets/sfx/pop.mp3" data-start="12.7" data-duration="0.72" data-track-index="13" data-volume="0.4"></audio>
      <audio id="demo-arrival" src="assets/sfx/notification.mp3" data-start="13.5" data-duration="2.35" data-track-index="14" data-volume="0.32"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#guestbook-demo", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 6.15);
      tl.to("#landing-demo", { opacity: 0, duration: 0.25, ease: "power2.in" }, 6.15);

      tl.to("#guestbook-demo", {
        scale: 1.8,
        y: -828,
        duration: 1.05,
        ease: "power3.inOut"
      }, 7.9);

      tl.to("#guestbook-demo", {
        y: -500,
        duration: 0.85,
        ease: "power3.inOut"
      }, 13.0);

      tl.to("#guestbook-demo", {
        scale: 1.42,
        y: -295,
        duration: 0.75,
        ease: "power3.out"
      }, 13.9);

      tl.to({}, { duration: 15.9 }, 0);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
